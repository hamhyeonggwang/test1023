<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8eff7"><meta name="application-name" content="나의 소비생활"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="나의 소비생활"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>나의 소비생활</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#203246;background:#e9f0f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#d0e2f5,transparent 36%),radial-gradient(circle at 88% 18%,#d8e9e2,transparent 35%),#e9f0f8}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:620px;margin:auto;min-height:100vh;padding:24px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.eyebrow{font-size:11px;font-weight:800;color:#55718e;letter-spacing:1.8px}.top h1{font-size:27px;letter-spacing:-1px;margin:5px 0}.glass{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.92);box-shadow:0 12px 32px rgba(42,67,101,.08);border-radius:24px;backdrop-filter:blur(18px)}.card{padding:20px;margin-bottom:14px}.sub{color:#62758b;font-size:14px;line-height:1.6}.tiny{font-size:12px;color:#64788c}.section{font-size:19px;margin:26px 0 13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{text-align:left;min-height:151px;padding:18px;border-radius:23px;border:1px solid #fff;background:rgba(255,255,255,.75);box-shadow:0 8px 26px #315a8212;color:#24384f}.tile .symbol{display:flex;align-items:center;justify-content:center;width:43px;height:43px;border-radius:13px;background:#e5effa;color:#385f85;font-size:22px;margin-bottom:18px}.tile strong{display:block;font-size:16px}.tile small{display:block;margin-top:5px;color:#65788d;font-size:12px}.btn{border:0;background:#315d86;color:#fff;border-radius:15px;min-height:48px;padding:12px 17px;font-weight:750}.btn.alt{background:#e4edf6;color:#294761}.btn.ghost{background:#fff;border:1px solid #cfdae5;color:#34536f}.btn.danger{background:#fff0ee;color:#a83232}.btn.block{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(235,243,251,.88);border-top:1px solid #d7e3ef;backdrop-filter:blur(20px);z-index:10}.navInner{display:flex;justify-content:space-around;width:100%;max-width:600px}.nav button{min-width:73px;border:0;background:none;color:#6d8094;min-height:50px;border-radius:12px;font-size:12px}.nav button b{display:block;font-size:22px;margin-bottom:3px}.nav button.on{color:#1b4d7d;background:#dce9f7}.field{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}.control{display:block;width:100%;border:1.5px solid #cbd9e8;background:#fff;border-radius:13px;padding:13px 14px;min-height:48px;font-size:16px;color:#24384f}.control:focus,.btn:focus-visible,.tile:focus-visible,.choice:focus-visible{outline:3px solid #729fd1;outline-offset:2px}.notice{padding:13px 15px;border:1px solid #d8e3ec;border-radius:13px;background:#f5f9fd;color:#516b84;font-size:13px;line-height:1.55}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:8px}.titleRow h2{margin:0 0 5px;font-size:21px}.receiptItem{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #dde6ef;background:#fff;border-radius:16px;padding:13px 14px;margin-top:9px;min-height:66px;color:inherit}.receiptItem .date{font-size:11px;color:#718297}.receiptItem strong{display:block;margin:3px 0}.receiptItem .sum{margin-left:auto;font-weight:800;white-space:nowrap}.pill{padding:6px 10px;background:#e8eff7;border-radius:10px;color:#48627e;font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px}.stat{background:#fff;border-radius:16px;padding:16px}.stat strong{display:block;font-size:22px;margin-top:8px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week span{text-align:center;color:#75869a;font-size:12px;padding:8px 0}.day{border:0;min-height:53px;border-radius:12px;color:#2b4155;background:transparent;position:relative;font-size:14px}.day.has:after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#407eae;position:absolute;bottom:6px;left:calc(50% - 2.5px)}.day.selected{background:#d3e3f4;font-weight:800}.day:disabled{opacity:0}.choices{display:grid;gap:10px}.choice{width:100%;border:1.5px solid #d5e1ec;background:#fff;border-radius:16px;padding:15px;text-align:left;color:#284158;min-height:52px;font-weight:650}.choice.active{border-color:#457bac;background:#e6f1fd}.choice.center{text-align:center}.choice.correct{border-color:#438a6f;background:#e6f5ed}.choice.wrong{border-color:#bf8750;background:#fff2e3}.checkicon{float:right;color:#437ba5}.progress{height:7px;border-radius:10px;background:#d7e2ef;overflow:hidden;margin:12px 0 18px}.progress div{height:100%;background:#3b76a4}.imagePreview{width:100%;max-height:310px;object-fit:contain;background:#f7f9fc;border-radius:12px;border:1px solid #e0e7ef}.back{border:0;background:none;color:#3d6d97;font-weight:750;padding:10px 0;min-height:44px}.labelTag{font-size:12px;color:#6d8094;text-transform:uppercase;letter-spacing:1px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.line{border-top:1px solid #e1e9f0;padding-top:13px;margin-top:13px}.status{margin:12px 0;padding:12px;border-radius:12px;background:#e5f4ee;color:#24694c;font-size:14px}.warn{background:#fff1df;color:#8f5d26}.empty{text-align:center;padding:24px 12px;color:#728297}.modalBg{position:fixed;inset:0;background:#1d304866;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#f8fbff;border-radius:22px;padding:22px;max-width:420px;width:100%;max-height:88vh;overflow:auto}.modal h3{margin-top:0}.hide{display:none}.budget{height:13px;background:#dfe8f2;border-radius:15px;overflow:hidden}.budget>div{height:100%;background:#457fad}.footerHint{margin:15px 0 24px;font-size:12px;color:#718297;text-align:center}@media(min-width:650px){.app{padding-top:36px}.tile{min-height:165px}}@media(prefers-reduced-motion:no-preference){.tile,.btn,.choice{transition:transform .15s,background .15s}.tile:active,.btn:active,.choice:active{transform:scale(.985)}}
</style></head><body><div id="app" class="app"></div><nav id="nav" class="nav" aria-label="하단 메뉴"></nav><div id="modalMount"></div>
<script>
(()=>{'use strict';
const VERSION=1,DB='daily-receipt-mvp-v1',STORE='state';let db=null,model=null,screen='home',sub=null,editId=null,formImage='',formSource='manual',pickedDay='',month=new Date().toISOString().slice(0,7),practice=null,feedback=null,modalOpen=false;
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const money=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';const fmt=d=>d?d.replace(/-/g,'.'):'';const blank=()=>({version:VERSION,profiles:[{id:'default',name:'나'}],active:'default',deviceMode:'personal',receipts:[],experiences:[],activities:[],goals:[]});
async function init(){try{db=await new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const tx=db.transaction(STORE,'readonly');model=await new Promise((res,rej)=>{const q=tx.objectStore(STORE).get('main');q.onsuccess=()=>res(q.result||blank());q.onerror=()=>rej(q.error)})}catch(e){console.error(e);model=blank();window.storageDisabled=true}if(!model||!Array.isArray(model.profiles))model=blank();if(!model.profiles.some(p=>p.id===model.active))model.active=model.profiles[0]?.id||'default';render()}
function save(){return new Promise((res,rej)=>{if(!db)return rej(new Error('이 브라우저에서 저장소를 사용할 수 없습니다. HTTPS 또는 로컬 서버에서 열어 주세요.'));try{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(model,'main');tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('저장 실패'));tx.onabort=()=>rej(tx.error||new Error('저장 중단'))}catch(e){rej(e)}})}
async function commit(fn,success){let before=structuredClone(model);fn();try{await save();if(success)toast(success);render()}catch(e){model=before;alert('저장하지 못했습니다. 저장공간 또는 브라우저 설정을 확인하세요.\n'+e.message);render()}}
function toast(msg){const e=document.createElement('div');e.className='status';e.textContent=msg;$('#app')?.prepend(e);setTimeout(()=>e.remove(),2800)}
const mine=()=>model.receipts.filter(r=>r.profileId===model.active);const active=()=>model.profiles.find(p=>p.id===model.active);const exp=id=>model.experiences.find(x=>x.receiptId===id);const goal=()=>model.goals.find(g=>g.profileId===model.active);const byId=id=>mine().find(r=>r.id===id);const byDate=d=>mine().filter(r=>r.date===d).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const total=rr=>rr.reduce((a,r)=>a+r.amount,0);const button=(title,act,kind='')=>`<button class="btn ${kind}" data-act="${act}">${title}</button>`;
function go(s,p){screen=s;sub=p||null;feedback=null;render();scrollTo({top:0,behavior:'instant'})}function top(title,subtitle){return `<div class="top"><div><div class="eyebrow">MY MONEY JOURNAL</div><h1>${title}</h1>${subtitle?`<div class="sub">${subtitle}</div>`:''}</div><button class="btn alt" data-act="settings" aria-label="기록 관리">⚙</button></div>`}
function render(){if(!model)return;const nav=$('#nav');nav.innerHTML=`<div class="navInner">${[['home','⌂','홈'],['calendar','▦','달력'],['goal','◎','목표']].map(([id,icon,name])=>`<button class="${screen===id?'on':''}" data-act="${id}" ${screen===id?'aria-current="page"':''}><b>${icon}</b>${name}</button>`).join('')}</div>`;const views={home:homeView,register:registerView,calendar:calendarView,detail:detailView,experience:experienceView,practiceSelect:practiceSelectView,practice:practiceView,goal:goalView,settings:settingsView};$('#app').innerHTML=(views[screen]||homeView)();bind()}
function homeView(){let rr=mine().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return top('나의 소비생활',`${esc(active()?.name)}의 소비 기록`) +`<div class="grid">${[['register','▣','영수증 등록','오늘의 구매 기록'],['calendar','▦','소비 달력','지난 기록 보기'],['practiceSelect','◫','소비 연습','영수증 읽기'],['goal','◎','나의 목표','예산 살펴보기']].map(([a,s,t,d])=>`<button class="tile" data-act="${a}"><span class="symbol">${s}</span><strong>${t}</strong><small>${d}</small></button>`).join('')}</div><h2 class="section">최근 영수증</h2><div class="glass card">${rr.length?rr.map(r=>receiptCard(r)).join(''):'<div class="empty">첫 번째 영수증을 등록해 보세요.</div>'}</div><div class="footerHint">기록은 이 기기에 저장됩니다. 주기적으로 백업해 주세요.</div>`}
function receiptCard(r){return `<button class="receiptItem" data-act="detail" data-id="${esc(r.id)}"><span style="font-size:24px">▤</span><span><span class="date">${fmt(r.date)}</span><strong>${esc(r.store)}</strong></span><span class="sum">${money(r.amount)}</span></button>`}
function registerView(){let r=editId?byId(editId):null;return `<button class="back" data-act="${r?'detail':'home'}" ${r?`data-id="${r.id}"`:''}>← 돌아가기</button>`+top(r?'영수증 수정':'영수증 등록','이미지를 보거나 직접 입력할 수 있어요.')+`<div class="glass card"><h2 style="margin-top:0;font-size:18px">등록 방법</h2><div class="grid"><button class="choice center" data-act="camera">▣<br>카메라 촬영</button><button class="choice center" data-act="gallery">▧<br>사진 선택</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" class="hide"><input id="galleryInput" type="file" accept="image/*" class="hide"><p class="tiny">직접 입력하려면 아래 칸을 사용하세요. 이미지는 기기 안에 저장됩니다.</p><div id="imageArea">${formImage?`<img class="imagePreview" alt="등록한 영수증" src="${formImage}"><button type="button" class="btn ghost" style="margin-top:8px" data-act="removeImage">이미지 제외하기</button>`:'<div class="notice">선택한 영수증 이미지가 없습니다. 사진 없이도 등록할 수 있어요.</div>'}</div><label class="field" for="receiptDate">구매한 날짜</label><input id="receiptDate" class="control" type="date" value="${r?.date||today()}" required><label class="field" for="receiptStore">가게 이름</label><input id="receiptStore" class="control" placeholder="예: 편의점" autocomplete="off" maxlength="80" value="${esc(r?.store||'')}"><label class="field" for="receiptAmount">결제금액 (원)</label><input id="receiptAmount" class="control" type="number" min="0" max="999999999" step="1" inputmode="numeric" placeholder="숫자를 입력하세요" value="${r?r.amount:''}"><div class="notice" style="margin:15px 0">이 버전에서는 글자를 자동으로 인식하지 않습니다. 사진을 보고 날짜·가게·총금액을 직접 확인해 주세요.</div>${button('영수증 저장하기','saveReceipt','block')}</div>`}
function calendarView(){const [y,m]=month.split('-').map(Number),start=new Date(y,m-1,1).getDay(),length=new Date(y,m,0).getDate();let inMonth=mine().filter(r=>r.date.slice(0,7)===month);if(!pickedDay||pickedDay.slice(0,7)!==month)pickedDay=month+'-01';const cells=Array.from({length:Math.ceil((start+length)/7)*7},(_,i)=>i-start+1);return top('소비 달력','날짜를 누르면 영수증을 볼 수 있어요.')+`<div class="glass card"><div class="row"><button class="btn alt" data-act="prevMonth" aria-label="이전 달">‹</button><h2 style="margin:0">${y}년 ${m}월</h2><button class="btn alt" data-act="nextMonth" aria-label="다음 달">›</button></div><div class="stats" style="margin:16px 0"><div class="stat"><div class="tiny">영수증</div><strong>${inMonth.length}장</strong></div><div class="stat"><div class="tiny">사용한 돈</div><strong>${money(total(inMonth))}</strong></div></div><div class="week">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells.map(d=>{let valid=d>0&&d<=length,ds=`${month}-${String(d).padStart(2,'0')}`;return `<button class="day ${valid&&byDate(ds).length?'has':''} ${ds===pickedDay?'selected':''}" data-act="selectDay" data-date="${ds}" ${valid?'':'disabled'} aria-label="${valid?`${m}월 ${d}일`:''}">${valid?d:''}</button>`}).join('')}</div></div><div class="glass card"><div class="row"><h2 style="font-size:18px;margin:0">${Number(pickedDay.slice(-2))}일의 기록</h2><span class="pill">${byDate(pickedDay).length}장</span></div>${byDate(pickedDay).length?byDate(pickedDay).map(receiptCard).join(''):'<div class="empty">등록한 영수증이 없어요.</div>'}</div>`}
function detailView(){let r=byId(sub);if(!r)return `<p>영수증을 찾을 수 없습니다.</p>${button('홈으로','home')}`;const e=exp(r.id),a=model.activities.filter(x=>x.receiptId===r.id).length;return `<button class="back" data-act="calendar">← 달력으로</button>`+top('영수증 상세','구매 기록을 확인해 보세요.')+`<div class="glass card">${r.imageData?`<img class="imagePreview" src="${r.imageData}" alt="영수증 이미지">`:''}<div class="labelTag">가게</div><h2>${esc(r.store)}</h2><div class="row line"><span>구매 날짜</span><strong>${fmt(r.date)}</strong></div><div class="row line"><span>결제금액</span><strong>${money(r.amount)}</strong></div><div class="actions" style="margin-top:20px">${button('내용 수정','editReceipt','alt')}${button('기록 삭제','deleteReceipt','danger')}</div></div><div class="glass card"><h2>구매 경험</h2><p class="sub">${e?'나의 구매 경험을 기록했어요.':'내가 직접 했던 일을 선택해 볼까요? (선택)'}</p>${button(e?'경험 다시 보기':'경험 체크하기','experience','block alt')}</div><div class="glass card"><h2>소비 연습</h2><p class="sub">이 영수증으로 가게, 날짜, 금액을 찾아보세요.</p><p class="tiny">이 영수증으로 완료한 연습: ${a}회</p>${button('읽기 연습 시작','startPractice','block')}</div>`}
const actionLabels=['물건을 직접 골랐어요','가격을 확인했어요','직접 결제했어요','영수증을 확인했어요'];const supports=[['alone','혼자 했어요'],['some','조금 도움받았어요'],['much','많이 도움받았어요']];const feelings=[['good','좋았어요'],['okay','보통이에요'],['hard','어려웠어요']];
function experienceView(){let r=byId(sub);if(!r)return homeView();let e=exp(r.id)||{actions:[],support:null,feeling:null};return `<button class="back" data-act="detail" data-id="${r.id}">← 영수증으로</button>`+top('나의 구매 경험',`${esc(r.store)} · ${fmt(r.date)}`)+`<div class="glass card"><h2>내가 직접 한 일을 골라요</h2><div class="choices" id="actionChecks">${actionLabels.map((label,i)=>`<button class="choice ${e.actions.includes(i)?'active':''}" data-act="toggleAction" data-value="${i}" aria-pressed="${e.actions.includes(i)}">${label}<span class="checkicon">${e.actions.includes(i)?'☑':'□'}</span></button>`).join('')}</div><h2 class="section">도움이 필요했나요?</h2><div class="choices" id="supportChecks">${supports.map(([v,t])=>`<button class="choice ${e.support===v?'active':''}" data-act="setSupport" data-value="${v}">${t}</button>`).join('')}</div><h2 class="section">오늘 구매 경험은 어땠나요?</h2><div class="grid" style="grid-template-columns:repeat(3,1fr)" id="feelingChecks">${feelings.map(([v,t])=>`<button class="choice center ${e.feeling===v?'active':''}" data-act="setFeeling" data-value="${v}">${t}</button>`).join('')}</div><div class="actions" style="margin-top:23px">${button('건너뛰기','skipExperience','alt')}${button('경험 저장하기','saveExperience')}</div></div><p class="tiny">체크하지 않은 행동은 '하지 않았다'는 뜻이 아닙니다. 건너뛰어도 영수증은 남아요.</p>`}
function practiceSelectView(){let rr=mine().slice().sort((a,b)=>b.date.localeCompare(a.date));return top('소비 연습','연습에 사용할 영수증을 골라요.')+`<div class="glass card"><h2 style="margin-top:0">어떤 영수증으로 연습할까요?</h2>${rr.length?rr.map(r=>`<button class="receiptItem" data-act="choosePractice" data-id="${r.id}"><span style="font-size:24px">▤</span><span><span class="date">${fmt(r.date)}</span><strong>${esc(r.store)}</strong></span><span class="sum">›</span></button>`).join(''):'<div class="empty">먼저 영수증을 등록해 주세요.</div>'}${!rr.length?button('영수증 등록','register','block'):''}</div>`}
function choicesFor(r,step){let right=step===0?r.store:step===1?fmt(r.date):money(r.amount);let wrong=step===0?['문구점','우리동네 마트','카페','편의점','서점','빵집']:step===1?[-3,-1,2,4].map(d=>{let x=new Date(r.date+'T12:00:00');x.setDate(x.getDate()+d);return fmt([x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-'))}):[500,1000,2000,-500].map(n=>money(Math.max(0,r.amount+n)));let options=[right,...wrong.filter(x=>x!==right)].slice(0,4);return options.sort((a,b)=>((a.length+b.length)%2?-1:1)).sort((a,b)=>String(a).localeCompare(String(b),'ko'))}
function practiceView(){let r=byId(practice?.id);if(!r)return practiceSelectView();if(practice.step>=3)return `<button class="back" data-act="practiceSelect">← 연습 목록</button>`+top('연습 완료','세 가지 정보를 모두 확인했어요.')+`<div class="glass card"><h2>잘했어요!</h2><p class="sub">선택한 영수증의 날짜, 가게 이름, 사용금액을 확인했습니다.</p>${button('연습 끝내기','finishPractice','block')}</div>`;let q=['어느 가게에서 샀나요?','언제 물건을 샀나요?','얼마를 사용했나요?'][practice.step],right=[r.store,fmt(r.date),money(r.amount)][practice.step];return `<button class="back" data-act="practiceSelect">← 목록으로</button>`+top('영수증 읽기',`문제 ${practice.step+1} / 3`)+`<div class="glass card"><div class="progress"><div style="width:${practice.step/3*100}%"></div></div>${r.imageData?`<img class="imagePreview" src="${r.imageData}" alt="연습할 영수증 원본">`:`<div class="notice">${esc(r.store)}<br>날짜: ${fmt(r.date)}<br>총금액: ${money(r.amount)}</div>`}<h2 class="section">${q}</h2><div class="grid">${choicesFor(r,practice.step).map(o=>`<button class="choice center ${feedback?.answer===o?(o===right?'correct':'wrong'):''}" data-act="answer" data-value="${esc(o)}" ${feedback?.correct?'disabled':''}>${esc(o)}</button>`).join('')}</div>${feedback?`<div class="status ${feedback.correct?'':'warn'}">${feedback.correct?'정확하게 찾았어요!':'영수증을 다시 확인해 보세요.'}</div>${feedback.correct?button('다음으로','nextQuestion','block'):button('다시 선택하기','retryQuestion','block alt')}`:''}</div>`}
function goalView(){let g=goal(),periodStart=g?.startDate||today().slice(0,7)+'-01',periodEnd=g?.endDate||today(),spent=total(mine().filter(r=>r.date>=periodStart&&r.date<=periodEnd)),budget=g?.amount||0,remaining=budget-spent;return top('나의 목표','내가 정한 예산과 사용한 돈을 비교해요.')+`<div class="glass card"><h2 style="margin-top:0">예산 목표 설정</h2><label class="field" for="budgetAmount">예산 금액 (원)</label><input id="budgetAmount" type="number" class="control" inputmode="numeric" step="100" min="0" max="999999999" value="${g?g.amount:''}" placeholder="예: 30000"><label class="field" for="goalStart">시작 날짜</label><input id="goalStart" type="date" class="control" value="${periodStart}"><label class="field" for="goalEnd">끝 날짜</label><input id="goalEnd" type="date" class="control" value="${periodEnd}"><div style="margin-top:18px">${button('나의 목표 저장','saveGoal','block')}</div></div>${g?`<div class="glass card"><h2 style="margin-top:0">목표와 비교</h2><div class="row"><span>설정한 예산</span><strong>${money(budget)}</strong></div><div class="row line"><span>사용한 돈</span><strong>${money(spent)}</strong></div><div class="row line"><span>${remaining>=0?'남은 예산':'초과한 금액'}</span><strong>${money(Math.abs(remaining))}</strong></div><div class="budget" style="margin-top:19px"><div style="width:${budget?Math.min(100,Math.round(spent/budget*100)):0}%"></div></div><p class="sub">${remaining>=0?'목표 기간 안에서 사용한 금액을 확인해 보세요.':'설정한 예산보다 많이 사용했어요. 다음 소비를 함께 계획해 보세요.'}</p><p class="tiny">${fmt(periodStart)} ~ ${fmt(periodEnd)} · 등록한 영수증 기준</p></div>`:'<div class="notice">목표를 저장하면 현재 사용금액과 비교할 수 있어요.</div>'}`}
function settingsView(){return `<button class="back" data-act="home">← 홈으로</button>`+top('기록 관리','프로필 및 데이터 백업')+`<div class="glass card"><h2 style="margin-top:0">사용 중인 프로필</h2><label class="field">학생 선택</label><select class="control" id="profileSelect">${model.profiles.map(p=>`<option value="${p.id}" ${model.active===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="actions" style="margin-top:12px">${button('새 프로필','addProfile','alt')}${button('현재 프로필 삭제','deleteProfile','danger')}</div><label class="field">기기 사용 방식</label><select id="deviceMode" class="control"><option value="personal" ${model.deviceMode==='personal'?'selected':''}>개인 스마트폰</option><option value="shared" ${model.deviceMode==='shared'?'selected':''}>공용 태블릿</option></select><p class="tiny">프로필은 앱 화면에서만 구분됩니다. 공용 기기의 강한 접근제어 기능은 제공하지 않습니다.</p></div><div class="glass card"><h2 style="margin-top:0">백업과 복원</h2><p class="sub">영수증 이미지와 기록을 JSON 파일로 내보냅니다. 파일에는 개인정보가 있을 수 있으며 암호화되지 않습니다.</p><div class="actions">${button('백업 내보내기','backup','alt')}${button('파일 복원하기','restore','alt')}</div><input id="restoreInput" type="file" accept="application/json,.json" class="hide"><p class="tiny">복원은 기존 기기 기록을 백업 파일 내용으로 완전히 교체합니다.</p></div><div class="glass card"><h2 style="margin-top:0">기록 관리</h2><p class="sub">공용 기기에서 원본 영수증을 저장할 때 개인 정보가 노출되지 않도록 유의하세요.</p>${button('전체 로컬 기록 초기화','clearAll','block danger')}</div>`}
function bind(){document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>dispatch(el.dataset.act,el.dataset)));const ci=$('#cameraInput'),gi=$('#galleryInput');if(ci)ci.onchange=e=>imageSelected(e.target.files?.[0]);if(gi)gi.onchange=e=>imageSelected(e.target.files?.[0]);const ri=$('#restoreInput');if(ri)ri.onchange=e=>restoreFile(e.target.files?.[0]);const ps=$('#profileSelect');if(ps)ps.onchange=e=>commit(()=>model.active=e.target.value,'프로필을 변경했습니다.');const dm=$('#deviceMode');if(dm)dm.onchange=e=>commit(()=>model.deviceMode=e.target.value,'기기 방식을 저장했습니다.')}
function dispatch(a,d={}){const routes=['home','calendar','goal','register','settings','experience','practiceSelect'];if(routes.includes(a)){if(a==='register'){editId=null;formImage='';formSource='manual'}go(a, a==='experience'?sub:null);return}if(a==='camera'||a==='gallery'){document.getElementById(a==='camera'?'cameraInput':'galleryInput')?.click();return}if(a==='removeImage'){formImage='';const el=$('#imageArea');el.innerHTML='<div class="notice">이미지를 제외했습니다. 정보는 직접 입력할 수 있습니다.</div>';return}if(a==='saveReceipt'){saveReceipt();return}if(a==='detail'){go('detail',d.id||sub);return}if(a==='editReceipt'){const r=byId(sub);editId=r.id;formImage=r.imageData||'';formSource=r.source;go('register');return}if(a==='deleteReceipt'){confirmDialog('이 영수증과 연결된 연습·경험 기록을 삭제할까요?',()=>commit(()=>{model.receipts=model.receipts.filter(r=>r.id!==sub);model.experiences=model.experiences.filter(x=>x.receiptId!==sub);model.activities=model.activities.filter(x=>x.receiptId!==sub)},'영수증을 삭제했습니다.').then(()=>go('calendar')));return}if(a==='prevMonth'||a==='nextMonth'){let [y,m]=month.split('-').map(Number);month=new Date(y,m-1+(a==='prevMonth'?-1:1),1).toISOString().slice(0,7);pickedDay=month+'-01';render();return}if(a==='selectDay'){pickedDay=d.date;render();return}if(a==='toggleAction'||a==='setSupport'||a==='setFeeling'){let e=exp(sub)||{receiptId:sub,actions:[],support:null,feeling:null};if(a==='toggleAction'){let n=Number(d.value);e.actions=e.actions.includes(n)?e.actions.filter(x=>x!==n):[...e.actions,n]}if(a==='setSupport')e.support=d.value;if(a==='setFeeling')e.feeling=d.value;window.draftExperience=e;updateExperienceView(e);return}if(a==='skipExperience'){window.draftExperience=null;go('detail',sub);return}if(a==='saveExperience'){let e=window.draftExperience||exp(sub)||{receiptId:sub,actions:[],support:null,feeling:null};commit(()=>{model.experiences=model.experiences.filter(x=>x.receiptId!==sub);model.experiences.push({...e,updatedAt:new Date().toISOString()})},'구매 경험을 저장했습니다.').then(()=>{window.draftExperience=null;go('detail',sub)});return}if(a==='choosePractice'||a==='startPractice'){practice={id:d.id||sub,step:0,answers:[],attempts:[]};feedback=null;go('practice');return}if(a==='answer'){let r=byId(practice.id);let right=[r.store,fmt(r.date),money(r.amount)][practice.step];const isRight=d.value===right;practice.attempts[practice.step]=(practice.attempts[practice.step]||0)+1;feedback={answer:d.value,correct:isRight};if(isRight)practice.answers[practice.step]=d.value;render();return}if(a==='retryQuestion'){feedback=null;render();return}if(a==='nextQuestion'){practice.step++;feedback=null;render();return}if(a==='finishPractice'){const p=structuredClone(practice);commit(()=>model.activities.push({id:uid(),receiptId:p.id,profileId:model.active,answers:p.answers,attempts:p.attempts,completedAt:new Date().toISOString()}),'소비 연습을 기록했습니다.').then(()=>go('detail',p.id));return}if(a==='saveGoal'){saveGoal();return}if(a==='addProfile'){promptDialog('새 학생 별칭', '예: 학생 A',v=>{if(!v.trim())return;commit(()=>{let id=uid();model.profiles.push({id,name:v.trim().slice(0,30),createdAt:new Date().toISOString()});model.active=id},'프로필을 추가했습니다.')});return}if(a==='deleteProfile'){if(model.profiles.length<=1){alert('최소 하나의 프로필이 필요합니다.');return}confirmDialog('현재 학생의 영수증, 경험, 활동, 목표 기록이 모두 삭제됩니다. 계속할까요?',()=>commit(()=>{let id=model.active;model.profiles=model.profiles.filter(p=>p.id!==id);model.receipts=model.receipts.filter(r=>r.profileId!==id);let ids=new Set(model.receipts.map(r=>r.id));model.experiences=model.experiences.filter(e=>ids.has(e.receiptId));model.activities=model.activities.filter(x=>x.profileId!==id);model.goals=model.goals.filter(g=>g.profileId!==id);model.active=model.profiles[0].id},'프로필을 삭제했습니다.'));return}if(a==='backup'){backup();return}if(a==='restore'){$('#restoreInput')?.click();return}if(a==='clearAll'){confirmDialog('기기 안의 모든 학생 및 영수증 기록이 삭제됩니다. 먼저 백업했나요?',()=>commit(()=>model=blank(),'기록을 초기화했습니다.'));return}}
function updateExperienceView(e){document.querySelectorAll('#actionChecks .choice').forEach((b,i)=>{b.classList.toggle('active',e.actions.includes(i));b.setAttribute('aria-pressed',e.actions.includes(i));b.querySelector('.checkicon').textContent=e.actions.includes(i)?'☑':'□'});document.querySelectorAll('#supportChecks .choice').forEach((b,i)=>b.classList.toggle('active',e.support===supports[i][0]));document.querySelectorAll('#feelingChecks .choice').forEach((b,i)=>b.classList.toggle('active',e.feeling===feelings[i][0]))}
async function imageSelected(file){if(!file)return;if(!file.type.startsWith('image/'))return alert('이미지 파일을 선택해 주세요.');if(file.size>15*1024*1024)return alert('15MB 이하의 이미지를 선택해 주세요.');try{let url=URL.createObjectURL(file);let img=new Image();await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=url});let scale=Math.min(1,1300/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);formImage=c.toDataURL('image/jpeg',.72);formSource='image';URL.revokeObjectURL(url);$('#imageArea').innerHTML=`<img class="imagePreview" src="${formImage}" alt="등록할 영수증 이미지"><button class="btn ghost" style="margin-top:8px" data-act="removeImage">이미지 제외하기</button>`;$('#imageArea [data-act]').onclick=()=>dispatch('removeImage')}catch(e){alert('이미지를 열지 못했습니다. 다른 파일을 선택해 주세요.')}}
async function saveReceipt(){let date=$('#receiptDate').value,store=$('#receiptStore').value.trim(),amountValue=$('#receiptAmount').value,amount=Number(amountValue);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00:00').getTime()))return alert('구매 날짜를 확인해 주세요.');if(!store)return alert('가게 이름을 입력해 주세요.');if(amountValue===''||!Number.isSafeInteger(amount)||amount<0||amount>999999999)return alert('결제금액을 0원 이상의 정수로 입력해 주세요.');let id=editId||uid(),old=editId?byId(editId):null;let row={id,profileId:model.active,date,store,amount,imageData:formImage||null,source:formSource,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};await commit(()=>{model.receipts=model.receipts.filter(x=>x.id!==id);model.receipts.push(row)},'영수증을 저장했습니다.');if(byId(id)){editId=null;formImage='';pickedDay=date;month=date.slice(0,7);go('detail',id)}}
async function saveGoal(){let v=$('#budgetAmount').value,amount=Number(v),startDate=$('#goalStart').value,endDate=$('#goalEnd').value;if(v===''||!Number.isSafeInteger(amount)||amount<0||amount>999999999)return alert('예산을 0원 이상의 정수로 입력해 주세요.');if(!startDate||!endDate||startDate>endDate)return alert('목표 기간을 올바르게 선택해 주세요.');await commit(()=>{model.goals=model.goals.filter(g=>g.profileId!==model.active);model.goals.push({profileId:model.active,amount,startDate,endDate,updatedAt:new Date().toISOString()})},'소비 목표를 저장했습니다.')}
function backup(){try{const data={schema:VERSION,exportedAt:new Date().toISOString(),data:model};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-receipts-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){alert('백업 파일을 만들지 못했습니다.')}}
async function restoreFile(file){if(!file)return;try{if(file.size>40*1024*1024)throw new Error('파일이 너무 큽니다 (40MB 이하).');let x=JSON.parse(await file.text());if(x.schema!==VERSION||!x.data||!Array.isArray(x.data.profiles)||!Array.isArray(x.data.receipts)||!Array.isArray(x.data.experiences)||!Array.isArray(x.data.activities)||!Array.isArray(x.data.goals))throw new Error('지원하지 않는 백업 형식입니다.');if(x.data.profiles.length<1||!x.data.profiles.every(p=>typeof p.id==='string'&&typeof p.name==='string')||!x.data.receipts.every(r=>typeof r.id==='string'&&typeof r.profileId==='string'&&typeof r.store==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isSafeInteger(r.amount)&&r.amount>=0))throw new Error('백업 데이터 구조가 올바르지 않습니다.');const ids=new Set(x.data.profiles.map(p=>p.id));if(!x.data.receipts.every(r=>ids.has(r.profileId)))throw new Error('영수증 프로필 연결이 올바르지 않습니다.');confirmDialog(`백업 파일의 프로필 ${x.data.profiles.length}개, 영수증 ${x.data.receipts.length}장을 복원할까요? 현재 기록은 모두 교체됩니다.`,async()=>{let old=structuredClone(model);model=x.data;model.active=ids.has(model.active)?model.active:model.profiles[0].id;try{await save();go('home');toast('복원을 완료했습니다.')}catch(e){model=old;alert('복원 실패: '+e.message);render()}})}catch(e){alert('백업 파일을 확인할 수 없습니다. '+e.message)}}
function confirmDialog(message,callback){if(modalOpen)return;modalOpen=true;$('#modalMount').innerHTML=`<div class="modalBg" role="dialog" aria-modal="true" aria-label="확인"><div class="modal"><h3>확인해 주세요</h3><p class="sub">${esc(message)}</p><div class="actions"><button id="cancelModal" class="btn alt">취소</button><button id="confirmModal" class="btn">확인</button></div></div></div>`;const close=()=>{modalOpen=false;$('#modalMount').innerHTML=''};$('#cancelModal').onclick=close;$('#confirmModal').onclick=()=>{close();callback()}}
function promptDialog(title,placeholder,callback){if(modalOpen)return;modalOpen=true;$('#modalMount').innerHTML=`<div class="modalBg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal"><h3>${esc(title)}</h3><input class="control" maxlength="30" placeholder="${esc(placeholder)}" id="promptValue"><div class="actions" style="margin-top:18px"><button class="btn alt" id="cancelModal">취소</button><button class="btn" id="confirmModal">추가하기</button></div></div></div>`;const close=()=>{modalOpen=false;$('#modalMount').innerHTML=''};$('#cancelModal').onclick=close;$('#confirmModal').onclick=()=>{let value=$('#promptValue').value;close();callback(value)};$('#promptValue').focus()}
init();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(err => console.warn('오프라인 캐시를 등록하지 못했습니다:',err)));
}
